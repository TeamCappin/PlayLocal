sonar.projectKey=TeamCappin_PlayLocal
sonar.organization=teamcappin

# Multi-language project structure
sonar.sources=playlocal/backend/src/main/java,playlocal/frontend/app,playlocal/frontend/components,playlocal/frontend/context,playlocal/frontend/hooks,playlocal/frontend/lib
sonar.tests=playlocal/backend/src/test/java,playlocal/frontend/test

# Exclusions
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/node_modules/**,**/coverage/**,**/.next/**,**/public/**,**/target/**,**/favicon.ico

# Exclude demo seed data from security analysis (contains intentional test bcrypt hashes)
# These are NOT real credentials - they are fixtures for demo/testing only
sonar.issue.ignore.multicriteria=e1,e2,e3,e4
sonar.issue.ignore.multicriteria.e1.ruleKey=secrets:S6706
sonar.issue.ignore.multicriteria.e1.resourceKey=**/db/migration/V9__seed_demo_data.sql
sonar.issue.ignore.multicriteria.e2.ruleKey=java:S6437
sonar.issue.ignore.multicriteria.e2.resourceKey=**/db/migration/V9__seed_demo_data.sql
sonar.issue.ignore.multicriteria.e3.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.e3.resourceKey=**/db/migration/V9__seed_demo_data.sql

# Exclude shadcn/ui components from accessibility checks (library code)
sonar.issue.ignore.multicriteria.e4.ruleKey=Web:TableWithoutCaptionCheck
sonar.issue.ignore.multicriteria.e4.resourceKey=**/components/ui/*.tsx


# Exclude SQL migrations from duplication detection (repetitive by nature)
sonar.cpd.exclusions=**/db/migration/*.sql

# Java/Backend coverage
sonar.java.binaries=playlocal/backend/target/classes
sonar.coverage.jacoco.xmlReportPaths=playlocal/backend/target/site/jacoco/jacoco.xml

# JavaScript/Frontend coverage
sonar.javascript.lcov.reportPaths=playlocal/frontend/coverage/lcov.info

# Ignore intentional demo seed data secrets in V9__seed_demo_data.sql
sonar.issue.ignore.multicriteria.e1.ruleKey=secrets:S6706
sonar.issue.ignore.multicriteria.e1.resourceKey=**/db/migration/V9__seed_demo_data.sql
sonar.issue.ignore.multicriteria.e2.ruleKey=java:S6437
sonar.issue.ignore.multicriteria.e2.resourceKey=**/db/migration/V9__seed_demo_data.sql
sonar.issue.ignore.multicriteria.e3.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.e3.resourceKey=**/db/migration/V9__seed_demo_data.sql