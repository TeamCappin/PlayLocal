sonar.projectKey=TeamCappin_PlayLocal
sonar.organization=teamcappin

# Coverage exclusions - exclude all files from coverage (configured separately)
sonar.coverage.exclusions=**/*

# COMPLETELY EXCLUDE demo seed data files from ALL analysis
# These files contain intentional demo bcrypt hashes for local development only.
# They are NOT production credentials and should not trigger security warnings.
sonar.exclusions=**/db/migration/V9__seed_demo_data.sql,**/db/migration/V11__expand_seed_data.sql

# Additional rule ignores for any files that slip through
sonar.issue.ignore.multicriteria=e1,e4
sonar.issue.ignore.multicriteria.e1.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.e1.resourceKey=**/db/migration/*.sql

# Exclude shadcn/ui components from accessibility checks (library code)
sonar.issue.ignore.multicriteria.e4.ruleKey=Web:TableWithoutCaptionCheck
sonar.issue.ignore.multicriteria.e4.resourceKey=**/components/ui/*.tsx

# Exclude SQL migrations from duplication detection (repetitive by nature)
sonar.cpd.exclusions=**/db/migration/*.sql

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8