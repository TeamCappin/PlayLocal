services:
  postgres:
    image: postgres:15-alpine
    container_name: playlocal-postgres
    environment:
      POSTGRES_DB: playlocal
      POSTGRES_USER: playlocal
      POSTGRES_PASSWORD: playlocal
    ports:
      - "5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playlocal -d playlocal"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - playlocal-net

  minio:
    image: minio/minio:latest
    container_name: playlocal-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - playlocal-net

  minio_init:
    image: minio/mc:latest
    container_name: playlocal-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/uploads || true;
      mc anonymous set none local/uploads || true;
      echo 'MinIO bucket ready';
      "
    networks:
      - playlocal-net

  backend:
    build:
      context: ./playlocal/backend
      dockerfile: Dockerfile
    container_name: playlocal-backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio_init:
        condition: service_started
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/playlocal
      DATABASE_USERNAME: playlocal
      DATABASE_PASSWORD: playlocal
      # DEV ONLY — this value is a known default and will be rejected by JwtSecretValidator in production
      JWT_SECRET: development-secret-key-change-in-production-min-32-chars
      SPRING_PROFILES_ACTIVE: dev
      # Local docker volume may contain older Flyway checksums from previous runs
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "false"

      # IMPORTANT: inside docker network, do NOT use localhost for minio
      endpoint: http://minio:9000
      publicEndpoint: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      S3_BUCKET: uploads
      S3_PRESIGNEXPIRYSECONDS: 900
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - playlocal-net

  frontend:
    build:
      context: ./playlocal/frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
    container_name: playlocal-frontend

    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - playlocal-net

volumes:
  postgres_data:
  minio_data:

networks:
  playlocal-net:
    driver: bridge
