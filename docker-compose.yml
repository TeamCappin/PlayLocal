services:
  postgres:
    image: postgres:15-alpine
    container_name: playlocal-postgres
    environment:
      POSTGRES_DB: playlocal
      POSTGRES_USER: playlocal
      POSTGRES_PASSWORD: playlocal
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playlocal -d playlocal"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - playlocal-net

  mongodb:
    image: mongo:7
    container_name: playlocal-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: alibou
      MONGO_INITDB_ROOT_PASSWORD: alibou
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - playlocal-net

  mongo-express:
    image: mongo-express:1.0.2
    container_name: playlocal-mongo-express
    restart: always
    depends_on:
      - mongodb
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: alibou
      ME_CONFIG_MONGODB_ADMINPASSWORD: alibou
      ME_CONFIG_MONGODB_SERVER: mongodb
      # optional:
      ME_CONFIG_BASICAUTH: "false"
    networks:
      - playlocal-net
      

  backend:
    build:
      context: ./playlocal/backend
      dockerfile: Dockerfile
    container_name: playlocal-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5433/playlocal
      DATABASE_USERNAME: playlocal
      DATABASE_PASSWORD: playlocal
      JWT_SECRET: development-secret-key-change-in-production-min-32-chars
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATA_MONGODB_URI: mongodb://alibou:alibou@mongodb:27017/chat_app?authSource=admin
      # CORS configuration if needed, or handled in code
    ports:
      - "8080:8080"
    networks:
      - playlocal-net

  frontend:
    build:
      context: ./playlocal/frontend
      dockerfile: Dockerfile
    container_name: playlocal-frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      NEXT_PUBLIC_WS_URL: http://localhost:8080/ws
    ports:
      - "3000:3000"
    networks:
      - playlocal-net

volumes:
  postgres_data:
  mongo_data:

networks:
  playlocal-net:
    driver: bridge
