spring:
  application:
    name: playlocal-backend

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5439/playlocal}
    username: ${DATABASE_USERNAME:playlocal}
    password: ${DATABASE_PASSWORD:playlocal}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

# Game lifecycle
game:
  lifecycle:
    update-interval-ms: 60000

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production-minimum-32-chars}
  expiration: ${JWT_EXPIRATION:86400000}  # 24 hours in milliseconds

# Rate Limiting
rate-limit:
  login:
    max-attempts: 5
    window-minutes: 15
  report:
    max-per-hour: 2
  general:
    requests-per-minute: 60


s3:
  endpoint: http://localhost:9000
  publicEndpoint: http://localhost:9000
  bucket: uploads
  region: us-east-1
  accessKey: minioadmin
  secretKey: minioadmin
  forcePathStyle: true
  presignExpirySeconds: 900
  
# Resend Email
resend:
  api-key: ${RESEND_API_KEY:re_test_placeholder}
  from-email: ${RESEND_FROM_EMAIL:onboarding@resend.dev}
  from-name: ${RESEND_FROM_NAME:PlayLocal}
  enabled: ${RESEND_ENABLED:false}

# Logging
# %X{correlationId} injects the request Correlation ID from MDC into every log line, and no-id is shown if no correlation ID is present.
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId:-no-id}] %-5level %logger{36} - %msg%n"
  level:
    com.backend.playlocal: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
