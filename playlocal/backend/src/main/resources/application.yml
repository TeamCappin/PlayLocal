spring:
  application:
    name: playlocal-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/playlocal}
    username: ${DATABASE_USERNAME:playlocal}
    password: ${DATABASE_PASSWORD:playlocal}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production-minimum-32-chars}
  expiration: ${JWT_EXPIRATION:86400000}  # 24 hours in milliseconds

# Rate Limiting
rate-limit:
  login:
    max-attempts: 5
    window-minutes: 15
  report:
    max-per-hour: 10
  general:
    requests-per-minute: 60

# Logging
logging:
  level:
    com.backend.playlocal: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

