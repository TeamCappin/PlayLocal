spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5439/playlocal
    username: playlocal
    password: playlocal

  jpa:
    show-sql: true
    open-in-view: true

  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration,classpath:db/migration-dev

logging:
  level:
    root: DEBUG
    com.backend.playlocal: DEBUG
    org.hibernate.SQL: DEBUG

game:
  lifecycle:
    update-interval-ms: 60000

s3:
  bucket: ${S3_BUCKET_NAME:uploads}
  region: ${AWS_REGION:us-east-1}
  accessKey: ${AWS_ACCESS_KEY_ID}
  secretKey: ${AWS_SECRET_ACCESS_KEY}
  endpoint: ${endpoint:http://localhost:9000}
  publicEndpoint: ${publicEndpoint:http://localhost:9000}
  forcePathStyle: ${S3_FORCE_PATH_STYLE:true}
  presignExpirySeconds: 900
mail:
  enabled: false

recaptcha:
  enabled: false