spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5439/playlocal}
    username: ${DATABASE_USERNAME:playlocal}
    password: ${DATABASE_PASSWORD:playlocal}

  jpa:
    show-sql: true
    open-in-view: true

  flyway:
    baseline-on-migrate: true
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}

logging:
  level:
    root: DEBUG
    com.backend.playlocal: DEBUG
    org.hibernate.SQL: DEBUG

game:
  lifecycle:
    update-interval-ms: 60000

s3:
  bucket: ${S3_BUCKET_NAME:${S3_BUCKET:uploads}}
  region: ${AWS_REGION:${S3_REGION:us-east-1}}
  accessKey: ${AWS_ACCESS_KEY_ID:${S3_ACCESS_KEY:minioadmin}}
  secretKey: ${AWS_SECRET_ACCESS_KEY:${S3_SECRET_KEY:minioadmin}}
  endpoint: ${endpoint:http://localhost:9000}
  publicEndpoint: ${publicEndpoint:http://localhost:9000}
  forcePathStyle: ${S3_FORCE_PATH_STYLE:true}
  presignExpirySeconds: 900
mail:
  enabled: false

recaptcha:
  enabled: false

# AI assistant (US 8.2): KB + permission-scoped user tools
playlocal:
  assistant:
    kb:
      min-score: 0.12
      min-token-overlap: 1