spring:
  config:
    activate:
      on-profile: prod
  application:
    name: playlocal-backend

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false

server:
  port: ${PORT:8080}
  connection-timeout: 5s

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: INFO
    com.backend.playlocal: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

s3:
  bucket: ${S3_BUCKET_NAME}
  region: ${AWS_REGION:us-east-2}
  accessKey: ${AWS_ACCESS_KEY_ID}
  secretKey: ${AWS_SECRET_ACCESS_KEY}
  endpoint: ${endpoint}
  publicEndpoint: ${publicEndpoint}
  forcePathStyle: false
  presignExpirySeconds: 900

mail:
  from-email: ${MAIL_FROM_EMAIL}
  from-name: ${MAIL_FROM_NAME:PlayLocal}
  enabled: ${MAIL_ENABLED:true}
  brevo-api-key: ${BREVO_API_KEY}   # ← add this line

recaptcha:
  secret-key: ${RECAPTCHA_SECRET_KEY}
  enabled: ${RECAPTCHA_ENABLED:true}
  score-threshold: ${RECAPTCHA_SCORE_THRESHOLD:0.5}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: alpha
