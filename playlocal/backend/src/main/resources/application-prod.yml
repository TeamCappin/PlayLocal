spring:
  main:
    lazy-initialization: true

  application:
    name: playlocal-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: false
    out-of-order: true

server:
  port: ${PORT:8080}           # Render automatically sets $PORT

# SECURITY: JWT_SECRET must be set to a strong, unique value whose UTF-8 encoding
# is at least 32 bytes (required for HMAC-SHA256) before deploying.
# Do not reuse any default or placeholder value.
# Startup will be rejected by JwtSecretValidator if this value is blank,
# matches a known default placeholder, or is shorter than 32 bytes.
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health         # Only expose /actuator/health to reduce overhead

logging:
  level:
    com.backend.playlocal: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

s3:
  bucket: ${S3_BUCKET_NAME}              
  region: ${AWS_REGION:us-east-2}
  accessKey: ${AWS_ACCESS_KEY_ID}
  secretKey: ${AWS_SECRET_ACCESS_KEY}
  endpoint: ${endpoint}
  publicEndpoint: ${publicEndpoint}
  forcePathStyle: false
  presignExpirySeconds: 900

resend:
  api-key: ${RESEND_API_KEY}
  from-email: ${RESEND_FROM_EMAIL}
  from-name: ${RESEND_FROM_NAME:PlayLocal}
  enabled: ${RESEND_ENABLED:true}

recaptcha:
  secret-key: ${RECAPTCHA_SECRET_KEY}
  enabled: ${RECAPTCHA_ENABLED:true}
  score-threshold: ${RECAPTCHA_SCORE_THRESHOLD:0.5}
