spring:
  main:
    lazy-initialization: true

  application:
    name: playlocal-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: false
    out-of-order: true

server:
  port: ${PORT:8080}           # Render automatically sets $PORT

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health         # Only expose /actuator/health to reduce overhead

logging:
  level:
    com.backend.playlocal: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
