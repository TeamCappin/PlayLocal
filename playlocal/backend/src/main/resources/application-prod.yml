spring:
  application:
    name: playlocal-backend

  # Production Database (Neon DB) - read from env variable
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none          # Do NOT validate schema, accept new columns/enums
    show-sql: false            # Disable SQL logging to speed up startup
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false         # Prevent queries during view rendering

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false  # Skip checksum validation, always accept migrations

server:
  port: ${PORT:8080}           # Render automatically sets $PORT

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health         # Only expose /actuator/health to reduce overhead

logging:
  level:
    com.backend.playlocal: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
