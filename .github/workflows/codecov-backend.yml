name: CodeCov (Backend)

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

jobs:
  test_backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests + JaCoCo report
        working-directory: playlocal/backend
        run: mvn -B test -Dtest="!*IntegrationTest,!*ConcurrencyTest,!PlayLocalApplicationTests"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: playlocal/backend/target/site/jacoco/jacoco.xml
          flags: backend
          fail_ci_if_error: true
