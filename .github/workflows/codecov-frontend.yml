name: CodeCov (Frontend)

on:
  push:
    branches: ["dev","dev_minh", "release"]
  pull_request:
    branches: ["dev","dev_minh", "release"]

jobs:
  test_frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: playlocal/frontend/package-lock.json

      - name: Install dependencies
        working-directory: playlocal/frontend
        run: npm ci

      - name: Run tests with coverage
        working-directory: playlocal/frontend
        run: npx jest --coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: playlocal/frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: true
