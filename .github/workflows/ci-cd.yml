name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: northamerica-northeast1
  REPOSITORY: permitparser
  REGION: northamerica-northeast1

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ./PermitParser-Application
        run: |
          python -m pip install --upgrade pip
          pip install -r ci-requirements.txt
          pip install pytest pytest-cov uvicorn httpx

      - name: Run tests
        working-directory: ./PermitParser-Application
        run: |
          pytest tests/ --cov=src --cov-report=xml || echo "No tests directory found, skipping pytest"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./PermitParser-Application/coverage.xml
          flags: unittests
          name: codecov-umbrella
        if: always()

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'

    strategy:
      matrix:
        service:
          [
            decomposition_service,
            parser_service,
            completion_tracker_service,
            scraper_service,
          ]

    name: Build and Deploy ${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Set up Cloud SDK
        uses: "google-github-actions/setup-gcloud@v2"

      - name: Configure Docker to use gcloud as a credential helper
        run: |
          gcloud auth configure-docker $GAR_LOCATION-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/${{ matrix.service }}:$GITHUB_SHA \
            -f PermitParser-Application/src/services/${{ matrix.service }}/Dockerfile \
            PermitParser-Application

      - name: Push Docker image to Artifact Registry
        run: |
          docker push $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/${{ matrix.service }}:$GITHUB_SHA

      - name: Deploy to Cloud Run
        run: |
          # Set service account based on service type
          if [ "${{ matrix.service }}" = "decomposition_service" ]; then
            SERVICE_ACCOUNT="decomposition-service@$PROJECT_ID.iam.gserviceaccount.com"
          elif [ "${{ matrix.service }}" = "parser_service" ]; then
            SERVICE_ACCOUNT="parser-service@$PROJECT_ID.iam.gserviceaccount.com"
          elif [ "${{ matrix.service }}" = "scraper_service" ]; then
            SERVICE_ACCOUNT="scraper-service@$PROJECT_ID.iam.gserviceaccount.com"
          else
            SERVICE_ACCOUNT="completion-tracker-service@$PROJECT_ID.iam.gserviceaccount.com"
          fi

          gcloud run deploy ${{ matrix.service }} \
            --image $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/${{ matrix.service }}:$GITHUB_SHA \
            --platform managed \
            --region $REGION \
            --allow-unauthenticated \
            --service-account=$SERVICE_ACCOUNT \
            --set-env-vars="GCP_PROJECT_ID=$PROJECT_ID,ENVIRONMENT=dev" \
            --memory=1Gi \
            --cpu=2 \
            --min-instances=0 \
            --max-instances=10 \
            --timeout=300s \
            --concurrency=100

      - name: Get service URL and update configuration
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ matrix.service }} --platform managed --region $REGION --format 'value(status.url)')
          echo "Service URL for ${{ matrix.service }}: $SERVICE_URL"

          # Store URLs for inter-service communication (this would be used to update service configs)
          echo "${{ matrix.service }}_url=$SERVICE_URL" >> $GITHUB_OUTPUT
