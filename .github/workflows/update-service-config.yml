name: Update Service Configuration

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types:
      - completed
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: northamerica-northeast1

jobs:
  update-config:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Set up Cloud SDK
        uses: "google-github-actions/setup-gcloud@v2"

      - name: Get service URLs and update configurations
        run: |
          # Get all service URLs
          DECOMPOSITION_URL=$(gcloud run services describe decomposition_service --platform managed --region $REGION --format 'value(status.url)' 2>/dev/null || echo "")
          PARSER_URL=$(gcloud run services describe parser_service --platform managed --region $REGION --format 'value(status.url)' 2>/dev/null || echo "")
          COMPLETION_URL=$(gcloud run services describe completion_tracker_service --platform managed --region $REGION --format 'value(status.url)' 2>/dev/null || echo "")

          echo "Service URLs:"
          echo "DecompositionService: $DECOMPOSITION_URL"
          echo "ParserService: $PARSER_URL"
          echo "CompletionTrackerService: $COMPLETION_URL"

          # Update ParserService with CompletionTrackerService URL
          if [ ! -z "$COMPLETION_URL" ] && [ ! -z "$PARSER_URL" ]; then
            echo "Updating ParserService configuration..."
            gcloud run services update parser_service \
              --platform managed \
              --region $REGION \
              --update-env-vars="COMPLETION_TRACKER_URL=$COMPLETION_URL/track-completion"
          fi

          # Update Pub/Sub subscription with ParserService URL
          if [ ! -z "$PARSER_URL" ]; then
            echo "Updating Pub/Sub subscription endpoint..."
            gcloud pubsub subscriptions modify-push-config parser-service-subscription \
              --push-endpoint="$PARSER_URL/process-work-unit"
          fi
