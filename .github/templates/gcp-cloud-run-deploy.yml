name: Deploy Image to Cloud Run
on:
  workflow_dispatch:
    inputs:
      revision_suffix:
        description: 'Optional revision suffix appended to the deployment'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

env:
  CLOUD_RUN_PLATFORM: managed
  CLOUD_RUN_FLAGS: '--allow-unauthenticated'

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy revision
        run: |
          IMAGE="${{ secrets.CLOUD_RUN_IMAGE }}"
          SERVICE="${{ secrets.CLOUD_RUN_SERVICE }}"
          REGION="${{ secrets.CLOUD_RUN_REGION }}"
          PLATFORM="${{ env.CLOUD_RUN_PLATFORM }}"
          FLAGS="${{ env.CLOUD_RUN_FLAGS }}"
          REVISION="${{ inputs.revision_suffix }}"

          cmd=(gcloud run deploy "${SERVICE}" \
            --image "${IMAGE}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${REGION}" \
            --platform "${PLATFORM}" \
            ${FLAGS})

          if [ -n "${REVISION}" ]; then
            cmd+=(--revision-suffix "${REVISION}")
          fi

          # shellcheck disable=SC2068
          ${cmd[@]}
